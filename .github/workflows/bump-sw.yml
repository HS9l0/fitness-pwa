name: Bump SW cache version

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  bump:
    # Skip the commit this workflow itself produces
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp SW cache with next version number
        run: |
          CURRENT=$(sed -n "s/.*fitplan-v\([0-9]\+\).*/\1/p" sw.js)
          NEXT=$((CURRENT + 1))
          echo "NEXT=$NEXT" >> "$GITHUB_ENV"
          sed -i "s/const CACHE = 'fitplan-[^']*'/const CACHE = 'fitplan-v$NEXT'/" sw.js

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sw.js
          git diff --staged --quiet && echo "sw.js unchanged" && exit 0
          git commit -m "chore: bump SW cache to fitplan-v$NEXT [skip ci]"
          git push
