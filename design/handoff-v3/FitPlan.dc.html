<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin:0; height:100%; }
  body { font-family: -apple-system, 'SF Pro Display', system-ui, sans-serif; }
</style>
</helmet>

<div style="height:100dvh;width:100vw;">
    <sc-if value="{{ isHome }}" hint-placeholder-val="{{ true }}">
      <div style="height:100%;"><dc-import name="FitHome" hint-size="100%,100%"></dc-import></div>
    </sc-if>
    <sc-if value="{{ isWorkout }}">
      <div style="height:100%;"><dc-import name="FitWorkout" hint-size="100%,100%"></dc-import></div>
    </sc-if>
    <sc-if value="{{ isSettings }}">
      <div style="height:100%;"><dc-import name="FitSettings" hint-size="100%,100%"></dc-import></div>
    </sc-if>
    <sc-if value="{{ isAdmin }}">
      <div style="height:100%;"><dc-import name="FitAdmin" hint-size="100%,100%"></dc-import></div>
    </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}">
class Component extends DCLogic {
  state = { screen: 'home' };
  renderVals() {
    const s = this.state.screen;
    return {
      isHome: s === 'home', isWorkout: s === 'workout', isSettings: s === 'settings', isAdmin: s === 'admin',
      goHome: () => this.setState({ screen: 'home' }),
      goWorkout: () => this.setState({ screen: 'workout' }),
      goSettings: () => this.setState({ screen: 'settings' }),
      goAdmin: () => this.setState({ screen: 'admin' }),
    };
  }
}
</script>
</body>
</html>
