<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
  html, body { margin:0; height:100%; background:#0d0d0f; }
  body { font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif; -webkit-font-smoothing:antialiased; }
  button, a { background:none; border:none; font:inherit; color:inherit; cursor:pointer; text-decoration:none; -webkit-tap-highlight-color:transparent; }
  @media (prefers-reduced-motion: reduce) {
    * { animation:none !important; transition-property:opacity,background-color,background,color !important; transition-duration:150ms !important; }
  }
</style>
</helmet>

<div style="height:100dvh;width:100vw;display:flex;align-items:center;justify-content:center;background:#0d0d0f;overflow:hidden;">
<div style="width:430px;height:932px;flex-shrink:0;transform:scale({{ scale }});transform-origin:center center;border-radius:52px;overflow:hidden;box-shadow:0 40px 90px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.07);display:flex;flex-direction:column;background:#000;--bg:#000000;--fill1:#1C1C1E;--fill2:#2C2C2E;--fill3:#3A3A3C;--sep:rgba(84,84,88,.5);--label:#FFFFFF;--label2:rgba(235,235,245,.60);--label3:rgba(235,235,245,.32);--accent:#A8E635;--onAccent:#182A04;--blue:#0A84FF;--e:cubic-bezier(0.32,0.72,0,1);">
  <div style="flex:1;min-height:0;padding:54px 8px 8px;box-sizing:border-box;background:#000;">
    <div style="height:100%;border-radius:24px;overflow:hidden;position:relative;background:var(--bg);color:var(--label);display:flex;flex-direction:column;">

      <!-- Large-title header -->
      <div style="display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding:14px 20px 16px;flex-shrink:0;">
        <div style="min-width:0;">
          <div style="font-size:15px;font-weight:600;color:var(--label2);letter-spacing:0;">Wednesday, July 1</div>
          <div style="font-size:34px;font-weight:700;letter-spacing:-0.9px;line-height:1.06;margin-top:2px;">Today</div>
        </div>
        <button aria-label="Settings" style="width:44px;height:44px;margin-bottom:2px;border-radius:22px;background:var(--fill1);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform 260ms var(--e),background 200ms var(--e);" style-hover="background:var(--fill2)" style-active="transform:scale(.94);transition:transform 90ms var(--e)">
          <svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="var(--label2)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09A1.7 1.7 0 0 0 9 19.4a1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.7 1.7 0 0 0 9 4.6 1.7 1.7 0 0 0 10 3.04V3a2 2 0 1 1 4 0v.09A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.7 1.7 0 0 0 19.4 9v0a1.7 1.7 0 0 0 1.56 1.03H21a2 2 0 1 1 0 4h-.09A1.7 1.7 0 0 0 19.4 15z"/></svg>
        </button>
      </div>

      <div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:0 20px;">

        <!-- Today's session -->
        <div style="border-radius:22px;overflow:hidden;background:var(--fill1);box-shadow:0 8px 24px rgba(0,0,0,.45);flex-shrink:0;">
          <div style="position:relative;padding:20px 20px 22px;background:linear-gradient(140deg,#5E8F14 0%,#2C6AAE 100%);">
            <div style="position:absolute;top:16px;right:18px;opacity:.24;">
              <svg viewBox="0 0 24 24" width="52" height="52" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7v10M7 5v14M17 5v14M20 7v10"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
            </div>
            <div style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.3px;color:rgba(255,255,255,.82);">Today's Session</div>
            <div style="font-size:27px;font-weight:700;color:#fff;letter-spacing:-0.6px;line-height:1.1;margin-top:7px;">Day 2 — Leg Day</div>
          </div>
          <div style="padding:16px 20px 18px;">
            <div style="font-size:15px;color:var(--label2);line-height:1.45;">Quads · Glutes · Hamstrings · Calves</div>
            <div style="display:flex;gap:10px;margin-top:14px;">
              <div style="flex:1;display:flex;align-items:center;gap:8px;background:var(--fill2);border-radius:12px;padding:11px 13px;">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 14.5 14.5"/></svg>
                <div><span style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;">50</span><span style="font-size:13px;color:var(--label2);"> min</span></div>
              </div>
              <div style="flex:1;display:flex;align-items:center;gap:8px;background:var(--fill2);border-radius:12px;padding:11px 13px;">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7v10M7 5v14M17 5v14M20 7v10"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
                <div><span style="font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;">6</span><span style="font-size:13px;color:var(--label2);"> exercises</span></div>
              </div>
            </div>
          </div>
        </div>

        <!-- This week -->
        <div style="border-radius:22px;overflow:hidden;background:var(--fill1);flex-shrink:0;">
          <div style="display:flex;align-items:center;gap:18px;padding:20px 20px 18px;">
            <div style="position:relative;width:84px;height:84px;flex-shrink:0;">
              <svg width="84" height="84" viewBox="0 0 84 84">
                <circle cx="42" cy="42" r="36" fill="none" stroke="var(--fill3)" stroke-width="9"/>
                <circle cx="42" cy="42" r="36" fill="none" stroke="var(--accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="150.8 226.2" transform="rotate(-90 42 42)"/>
              </svg>
              <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
                <span style="font-size:26px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-0.5px;">2</span>
                <span style="font-size:12px;color:var(--label2);margin-top:2px;">of 3</span>
              </div>
            </div>
            <div style="flex:1;min-width:0;">
              <div style="font-size:20px;font-weight:700;letter-spacing:-0.4px;">This Week</div>
              <div style="font-size:15px;color:var(--label2);line-height:1.4;margin-top:4px;">One more session to hit your goal.</div>
            </div>
          </div>
          <div style="display:flex;gap:6px;padding:0 16px 18px;">
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums;">25</div><div style="font-size:12px;color:var(--label3);font-weight:600;">Th</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--onAccent);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div style="font-size:12px;color:var(--label2);font-weight:600;">Fr</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums;">27</div><div style="font-size:12px;color:var(--label3);font-weight:600;">Sa</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums;">28</div><div style="font-size:12px;color:var(--label3);font-weight:600;">Su</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:var(--onAccent);"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div style="font-size:12px;color:var(--label2);font-weight:600;">Mo</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:var(--fill2);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:var(--label3);font-variant-numeric:tabular-nums;">30</div><div style="font-size:12px;color:var(--label3);font-weight:600;">Tu</div></div>
            <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;"><div style="width:34px;height:34px;border-radius:17px;background:transparent;box-shadow:inset 0 0 0 2px var(--accent);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums;">1</div><div style="font-size:12px;color:var(--accent);font-weight:600;">We</div></div>
          </div>
        </div>

        <!-- Last session -->
        <button style="display:flex;align-items:center;gap:14px;text-align:left;width:100%;padding:16px 18px;border-radius:22px;background:var(--fill1);flex-shrink:0;transition:transform 260ms var(--e),background 200ms var(--e);" style-hover="background:var(--fill2)" style-active="transform:scale(.985);transition:transform 90ms var(--e)">
          <div style="width:40px;height:40px;border-radius:20px;background:var(--fill2);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><polyline points="8.5 12 11 14.5 15.5 9.5"/></svg>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="font-size:17px;font-weight:600;letter-spacing:-0.2px;">Day 1 — Cardio</div>
            <div style="font-size:13px;color:var(--label2);margin-top:3px;">Mon, Jun 29 · 40 min · 5 exercises</div>
          </div>
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="var(--label3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><polyline points="9 18 15 12 9 6"/></svg>
        </button>

      </div>

      <!-- Translucent action bar -->
      <div style="flex-shrink:0;padding:14px 20px 18px;background:rgba(10,10,12,.72);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 -0.5px 0 var(--sep);">
        <button style="display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:54px;border-radius:16px;background:var(--accent);color:var(--onAccent);font-size:18px;font-weight:600;letter-spacing:-0.2px;box-shadow:0 6px 20px rgba(168,230,53,.24);transition:transform 260ms var(--e),opacity 200ms var(--e);" style-hover="opacity:.9" style-active="transform:scale(.975);transition:transform 90ms var(--e)">
          Start Workout
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

    </div>
  </div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:430,&quot;height&quot;:932}}">
class Component extends DCLogic {
  state = { scale: 1 };
  componentDidMount() { this.fit(); this._h = () => this.fit(); window.addEventListener('resize', this._h); }
  componentWillUnmount() { window.removeEventListener('resize', this._h); }
  fit() {
    this.setState({ scale: Math.min(1, (window.innerHeight - 24) / 932, (window.innerWidth - 24) / 430) });
  }
  renderVals() { return { scale: this.state.scale }; }
}
</script>
</body>
</html>
