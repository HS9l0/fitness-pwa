<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;display:flex;flex-direction:column;overflow:hidden;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">

  <!-- Compact nav header (Apple in-workout style) -->
  <div style="display:flex;align-items:center;gap:8px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0;">
    <button style="display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 10px 0 2px;font-size:13px;font-weight:600;color:var(--accent);flex-shrink:0;">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>Home
    </button>
    <div style="flex:1;min-width:0;text-align:center;">
      <div style="font-size:11px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Exercise <span style="color:var(--text);">2 of 6</span></div>
    </div>
    <div style="flex-shrink:0;min-width:38px;text-align:right;font-size:15px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;">12:45</div>
  </div>

  <!-- Top progress bar -->
  <div style="height:3px;background:var(--border);flex-shrink:0;">
    <div style="height:100%;width:33%;background:var(--accent);"></div>
  </div>

  <!-- Stage: active exercise -->
  <div style="flex:1;min-height:0;overflow:hidden;background:var(--surface);display:flex;flex-direction:column;">

    <!-- Hero title (no number badge — the top bar already conveys position) -->
    <div style="padding:14px 20px 10px;margin:0 4px;">
      <div style="font-size:23px;font-weight:800;letter-spacing:-0.3px;line-height:1.1;">Leg Extension Machine</div>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:5px;">
        <div style="font-size:13px;color:var(--muted);">Quads · front of thigh</div>
        <div style="font-size:13px;color:var(--accent2);font-weight:700;white-space:nowrap;">3 × 12</div>
      </div>
    </div>

    <div style="padding:0 20px 12px;flex:1;min-height:0;display:flex;flex-direction:column;">
      <!-- sets progress -->
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:9px;">
        <div style="flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden;"><div style="height:100%;width:33%;background:var(--accent2);border-radius:2px;"></div></div>
        <div style="font-size:10px;color:var(--dim);white-space:nowrap;font-variant-numeric:tabular-nums;">1 / 3</div>
      </div>

      <!-- sets list -->
      <div style="border-radius:20px;border:1px solid var(--border);overflow:hidden;background:var(--surface2);">

        <!-- set 1 done -->
        <div style="display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:24px;text-align:center;font-size:17px;font-weight:700;color:var(--dim);flex-shrink:0;padding-bottom:12px;">1</div>
            <div style="flex:1;display:flex;align-items:center;gap:14px;">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
                <div style="width:100%;padding:7px 4px;background:var(--field);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;text-align:center;color:var(--text);">40</div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--dim);">kg</div>
              </div>
              <div style="font-size:14px;color:var(--dim);padding-bottom:12px;">×</div>
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
                <div style="width:100%;padding:7px 4px;background:var(--field);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;text-align:center;color:var(--text);">12</div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--dim);">reps</div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button style="width:68px;height:38px;flex-shrink:0;border-radius:10px;background:var(--graySoft);color:var(--muted);font-size:13px;font-weight:600;">Skip</button>
            <button style="flex:1;height:38px;border-radius:10px;background:var(--accentSoft);color:var(--accent);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          </div>
        </div>

        <!-- set 2 active -->
        <div style="display:flex;flex-direction:column;gap:8px;padding:10px 14px;border-bottom:1px solid var(--border);">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:24px;text-align:center;font-size:17px;font-weight:700;color:var(--dim);flex-shrink:0;padding-bottom:12px;">2</div>
            <div style="flex:1;display:flex;align-items:center;gap:14px;">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
                <div style="width:100%;padding:7px 4px;background:var(--field);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;text-align:center;">40</div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--dim);">kg</div>
              </div>
              <div style="font-size:14px;color:var(--dim);padding-bottom:12px;">×</div>
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
                <div style="width:100%;padding:7px 4px;background:var(--field);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;text-align:center;">12</div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--dim);">reps</div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button style="width:68px;height:38px;flex-shrink:0;border-radius:10px;background:var(--graySoft);color:var(--muted);font-size:13px;font-weight:600;">Skip</button>
            <button style="flex:1;height:38px;border-radius:10px;background:var(--graySoft);color:var(--muted);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          </div>
        </div>

        <!-- set 3 pending -->
        <div style="display:flex;flex-direction:column;gap:8px;padding:10px 14px;">
          <div style="display:flex;align-items:center;gap:12px;">
            <div style="width:24px;text-align:center;font-size:17px;font-weight:700;color:var(--dim);flex-shrink:0;padding-bottom:12px;">3</div>
            <div style="flex:1;display:flex;align-items:center;gap:14px;">
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
                <div style="width:100%;padding:7px 4px;background:var(--field);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;text-align:center;color:var(--dim);">40</div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--dim);">kg</div>
              </div>
              <div style="font-size:14px;color:var(--dim);padding-bottom:12px;">×</div>
              <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;">
                <div style="width:100%;padding:7px 4px;background:var(--field);border:1.5px solid var(--border);border-radius:10px;font-size:18px;font-weight:700;text-align:center;color:var(--dim);">12</div>
                <div style="font-size:9px;text-transform:uppercase;letter-spacing:0.6px;color:var(--dim);">reps</div>
              </div>
            </div>
          </div>
          <div style="display:flex;gap:8px;">
            <button style="width:68px;height:38px;flex-shrink:0;border-radius:10px;background:var(--graySoft);color:var(--muted);font-size:13px;font-weight:600;">Skip</button>
            <button style="flex:1;height:38px;border-radius:10px;background:var(--graySoft);color:var(--muted);display:flex;align-items:center;justify-content:center;"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></button>
          </div>
        </div>

      </div>

      <!-- Watch tutorial (gray secondary, HIG) -->
      <a style="display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:9px 16px;min-height:40px;margin-top:9px;background:rgba(120,120,128,.12);border-radius:10px;color:var(--text);font-size:13px;font-weight:600;flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>Watch Tutorial
      </a>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:820}}"></script>
</body>
</html>
