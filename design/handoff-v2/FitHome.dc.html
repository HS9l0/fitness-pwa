<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:-apple-system,'SF Pro Display','SF Pro Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;">

  <!-- content (no scroll) -->
  <div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;">

    <!-- Masthead wordmark -->
    <div style="display:flex;align-items:center;gap:11px;padding:10px 20px 8px;flex-shrink:0;">
      <div style="width:28px;height:28px;border-radius:9px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="var(--onAccent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7v10M7 5v14M17 5v14M20 7v10"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:18px;font-weight:800;letter-spacing:-0.6px;line-height:1;">FitPlan</div>
        <div style="font-size:10px;color:var(--muted);font-weight:500;margin-top:2px;">Wednesday, July 1</div>
      </div>
    </div>

    <div style="padding:0 20px;flex:1;min-height:0;">

      <!-- Merged "This Week" card: ring + streak dots + last workout -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px;">
        <!-- ring row -->
        <div style="display:flex;align-items:center;gap:14px;padding:10px 16px;">
          <div style="position:relative;width:66px;height:66px;flex-shrink:0;">
            <svg width="66" height="66" viewBox="0 0 104 104">
              <circle cx="52" cy="52" r="44" fill="none" stroke="var(--accentSoft)" stroke-width="13"/>
              <circle cx="52" cy="52" r="44" fill="none" stroke="var(--accent)" stroke-width="13" stroke-linecap="round" stroke-dasharray="184.3 276.5" transform="rotate(-90 52 52)"/>
            </svg>
            <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0px;">
              <span style="font-size:17px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;">2</span>
              <span style="font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;">of 3</span>
            </div>
          </div>
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:3px;">
              <div style="font-size:14px;font-weight:700;">This Week</div>
              <button style="display:flex;align-items:center;gap:5px;color:var(--muted);font-size:11px;font-weight:600;background:var(--graySoft);border-radius:20px;padding:4px 9px;">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>History
              </button>
            </div>
            <div style="font-size:12px;color:var(--muted);line-height:1.35;"><strong style="color:var(--accent);font-weight:700;">1 more</strong> to hit your goal</div>
          </div>
        </div>
        <!-- streak dots -->
        <div style="display:flex;gap:5px;justify-content:space-between;padding:8px 16px;border-top:1px solid var(--border);">
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);">25</div><div style="font-size:8px;color:var(--dim);text-transform:uppercase;">Th</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--accent);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--onAccent);"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div style="font-size:8px;color:var(--dim);text-transform:uppercase;">Fr</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);">27</div><div style="font-size:8px;color:var(--dim);text-transform:uppercase;">Sa</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);">28</div><div style="font-size:8px;color:var(--dim);text-transform:uppercase;">Su</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--accent);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;color:var(--onAccent);"><svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></div><div style="font-size:8px;color:var(--dim);text-transform:uppercase;">Mo</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--surface2);border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);">30</div><div style="font-size:8px;color:var(--dim);text-transform:uppercase;">Tu</div></div>
          <div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;"><div style="width:20px;height:20px;border-radius:50%;background:var(--accentSoft);border:1.5px solid var(--accent);display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--accent);">1</div><div style="font-size:8px;color:var(--accent);text-transform:uppercase;">We</div></div>
        </div>
        <!-- last workout row (collapsible) -->
        <div style="border-top:1px solid var(--border);padding:0 16px;">
          <button style="display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;width:100%;text-align:left;">
            <div>
              <div style="font-size:12px;font-weight:700;">Day 1 — Cardio</div>
              <div style="font-size:9px;color:var(--muted);margin-top:1px;">Mon, Jun 29 · 40 min · 5 exercises</div>
            </div>
            <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
              <span style="color:var(--dim);display:flex;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="9 12 11 14 15 10"/></svg></span>
              <span style="color:var(--dim);display:flex;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></span>
            </div>
          </button>
        </div>
      </div>

      <!-- Next Up gradient card -->
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);margin-bottom:8px;">
        <div style="background:var(--grad);padding:10px 16px 13px;position:relative;min-height:50px;">
          <div style="position:absolute;top:10px;right:12px;opacity:0.28;">
            <svg viewBox="0 0 24 24" width="32" height="32" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7v10M7 5v14M17 5v14M20 7v10"/><line x1="7" y1="12" x2="17" y2="12"/></svg>
          </div>
          <div style="font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:1.2px;color:rgba(255,255,255,0.78);margin-bottom:4px;">Today · Wednesday</div>
          <div style="font-size:16px;font-weight:800;color:#fff;letter-spacing:-0.3px;">Day 2 — Leg Day</div>
        </div>
        <div style="padding:10px 16px 12px;">
          <div style="font-size:11px;color:var(--muted);margin-bottom:8px;">Quads · Glutes · Hamstrings · Calves</div>
          <div style="display:flex;gap:14px;">
            <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);font-weight:600;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 14.5 14.5"/></svg><span style="color:var(--text);font-weight:700;">~50</span> min</div>
            <div style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--dim);font-weight:600;"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7v10M7 5v14M17 5v14M20 7v10"/><line x1="7" y1="12" x2="17" y2="12"/></svg><span style="color:var(--text);font-weight:700;">6</span> exercises</div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <!-- Start Workout CTA -->
  <div style="padding:6px 20px 10px;background:var(--bg);flex-shrink:0;">
    <button style="display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px;background:var(--accent);color:var(--onAccent);font-weight:600;font-size:15px;border-radius:13px;min-height:44px;letter-spacing:-0.1px;">Start Workout <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg></button>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:820}}"></script>
</body>
</html>
